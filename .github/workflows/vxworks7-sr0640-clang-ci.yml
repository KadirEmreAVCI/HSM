name: VxWorks 7 SR0640 Clang CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  vxworks7-sr0640-clang-build:
    # Requires a self-hosted runner provisioned with VxWorks 7 SR0640 SDK + Clang toolchain.
    runs-on: [self-hosted, vxworks7, sr0640]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Show toolchain environment
        shell: bash
        run: |
          echo "WIND_CC_SYSROOT=${WIND_CC_SYSROOT}"
          echo "WIND_CLANG_TARGET=${WIND_CLANG_TARGET}"
          clang++ --version

      - name: Configure project (VxWorks 7 SR0640, Clang, C++17)
        shell: bash
        run: |
          cmake -S . -B build-vxworks \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/toolchains/vxworks7_sr0640_clang.cmake

      - name: Build project
        shell: bash
        run: cmake --build build-vxworks --config Release
