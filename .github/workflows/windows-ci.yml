name: Windows CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  static-analysis:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cppcheck
        run: choco install cppcheck -y

      - name: Static analysis (development folder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path reports -Force | Out-Null

          $stdCfg = Get-ChildItem -Path "C:\ProgramData\chocolatey" -Filter "std.cfg" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $stdCfg) {
            throw "cppcheck std.cfg not found under C:\ProgramData\chocolatey"
          }

          $cfgDir = $stdCfg.Directory.FullName
          cppcheck --data-dir="$cfgDir" --enable=all --inconclusive --xml --xml-version=2 development 2> reports/cppcheck-report.xml

      - name: Upload static analysis report
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-report
          path: reports/cppcheck-report.xml

  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure project
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build project
        run: cmake --build build --config Release

      - name: Run run-time tests (GoogleTest)
        shell: pwsh
        run: .\build\test\run_time\Release\hsm_run_time_tests.exe

      - name: Run compile-time tests (CTest)
        run: ctest --test-dir build -C Release --output-on-failure -L compile_time
