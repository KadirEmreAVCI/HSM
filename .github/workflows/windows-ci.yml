name: Windows CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  static-analysis:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cppcheck
        shell: pwsh
        run: choco install cppcheck -y

      - name: Run cppcheck (development folder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path reports -Force | Out-Null

          Set-Location $env:GITHUB_WORKSPACE
          $sourcePath = (Resolve-Path -LiteralPath "development").Path

          $cppcheckExe = Join-Path $env:ProgramFiles "Cppcheck\cppcheck.exe"
          if (-not (Test-Path $cppcheckExe)) {
            $cmd = Get-Command cppcheck -ErrorAction SilentlyContinue
            if ($cmd) {
              $cppcheckExe = $cmd.Source
            }
          }

          if (-not (Test-Path $cppcheckExe)) {
            throw "cppcheck executable not found in Program Files or PATH"
          }

          $args = @(
            "--enable=all",
            "--inconclusive",
            "--std=c++17",
            "--suppress=missingInclude",
            "--suppress=missingIncludeSystem",
            "--output-file=reports\cppcheck-report.txt",
            $sourcePath
          )

          & $cppcheckExe @args

      - name: Display cppcheck report
        shell: pwsh
        run: |
          Write-Host "==== Cppcheck output ===="
          Get-Content reports/cppcheck-report.txt

      - name: Upload static analysis report
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-report
          path: reports/cppcheck-report.txt

  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure project
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build project
        run: cmake --build build --config Release

      - name: Run run-time tests (GoogleTest)
        shell: pwsh
        run: .\build\test\run_time\Release\hsm_run_time_tests.exe

      - name: Run compile-time tests (CTest)
        run: ctest --test-dir build -C Release --output-on-failure -L compile_time
